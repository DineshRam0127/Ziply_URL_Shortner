<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Ziply — Sign in or create an account to manage your short links." />
  <title>Ziply — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css?v=5" />
</head>
<body class="auth-body">

  <!-- ── Background grid ── -->
  <div class="auth-grid-bg" aria-hidden="true"></div>

  <!-- ── Auth card ── -->
  <main class="auth-wrap" role="main">
    <div class="auth-card">

      <!-- Brand -->
      <div class="auth-brand">
        <span class="auth-brand-icon">⚡</span>
        <span class="auth-brand-wordmark">Ziply<span class="brand-dot">.</span></span>
      </div>
      <p class="auth-tagline">SHORTEN · TRACK · ANALYZE</p>

      <!-- Tab switcher -->
      <div class="auth-tabs" role="tablist" aria-label="Authentication mode">
        <button id="tab-login" class="auth-tab auth-tab--active" role="tab" aria-selected="true" aria-controls="panel-login">
          Sign In
        </button>
        <button id="tab-register" class="auth-tab" role="tab" aria-selected="false" aria-controls="panel-register">
          Create Account
        </button>
      </div>

      <!-- ── Login panel ── -->
      <div id="panel-login" class="auth-panel" role="tabpanel" aria-labelledby="tab-login">
        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="login-username">USERNAME</label>
            <input
              id="login-username"
              class="form-input"
              type="text"
              placeholder="your_username"
              autocomplete="username"
              spellcheck="false"
              aria-required="true"
            />
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">PASSWORD</label>
            <div class="password-wrap">
              <input
                id="login-password"
                class="form-input"
                type="password"
                placeholder="••••••••"
                autocomplete="current-password"
                aria-required="true"
              />
              <button type="button" class="pwd-toggle" aria-label="Show password" data-target="login-password">👁</button>
            </div>
          </div>
          <div id="login-error" class="form-alert form-alert-error" role="alert" hidden>
            <span class="alert-x">✕</span>
            <span id="login-error-msg"></span>
          </div>
          <button id="login-btn" class="btn btn-primary btn-full" type="submit">
            <span class="btn-text">Sign In</span>
            <span class="btn-spinner" hidden></span>
          </button>
        </form>
        <p class="auth-switch">
          Don't have an account?
          <button class="auth-switch-link" id="go-register">Create one →</button>
        </p>
      </div>

      <!-- ── Register panel ── -->
      <div id="panel-register" class="auth-panel" role="tabpanel" aria-labelledby="tab-register" hidden>
        <form id="register-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="reg-username">USERNAME</label>
            <input
              id="reg-username"
              class="form-input"
              type="text"
              placeholder="choose_a_username"
              autocomplete="username"
              spellcheck="false"
              aria-required="true"
            />
            <span class="form-hint">3–30 characters · letters, digits, - or _</span>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-password">PASSWORD</label>
            <div class="password-wrap">
              <input
                id="reg-password"
                class="form-input"
                type="password"
                placeholder="••••••••"
                autocomplete="new-password"
                aria-required="true"
              />
              <button type="button" class="pwd-toggle" aria-label="Show password" data-target="reg-password">👁</button>
            </div>
            <span class="form-hint">Minimum 6 characters</span>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-confirm">CONFIRM PASSWORD</label>
            <div class="password-wrap">
              <input
                id="reg-confirm"
                class="form-input"
                type="password"
                placeholder="••••••••"
                autocomplete="new-password"
                aria-required="true"
              />
              <button type="button" class="pwd-toggle" aria-label="Show password" data-target="reg-confirm">👁</button>
            </div>
          </div>
          <div id="reg-error" class="form-alert form-alert-error" role="alert" hidden>
            <span class="alert-x">✕</span>
            <span id="reg-error-msg"></span>
          </div>
          <button id="register-btn" class="btn btn-primary btn-full" type="submit">
            <span class="btn-text">Create Account</span>
            <span class="btn-spinner" hidden></span>
          </button>
        </form>
        <p class="auth-switch">
          Already have an account?
          <button class="auth-switch-link" id="go-login">Sign in →</button>
        </p>
      </div>

    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/static/login.js?v=5" defer></script>
</body>
</html>
